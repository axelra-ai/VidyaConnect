<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidyaConnect — Student</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.45.4/supabase.min.js"></script>
<style>
  :root{ --navy:#16294D; --navy-2:#1F3A6E; --gold:#E9A23B; --bg:#F5F7FB; --card:#fff; --text:#1A1E2B; --muted:#6B7280; --line:#E4E8F0; --ok:#2E7D5B; --danger:#C0392B; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding-bottom:78px;}
  header{background:var(--navy); color:#fff; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5;}
  header h1{font-family:'Poppins'; font-size:16px; margin:0;}
  header .role{font-size:11px; background:var(--gold); color:var(--navy); padding:3px 9px; border-radius:20px; font-weight:600;}
  .page{padding:16px; max-width:640px; margin:0 auto;}
  .hidden{display:none !important;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px;}
  .post{margin-bottom:12px;}
  .post .who{font-weight:600; font-size:14px;}
  .post .when{font-size:11.5px; color:var(--muted); margin-bottom:6px;}
  .post .body{font-size:14.5px; line-height:1.5;}
  .list-item{display:flex; justify-content:space-between; align-items:center; padding:13px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
  .list-item:last-child{border-bottom:none;}
  .list-item .name{font-weight:600; font-size:14.5px;}
  .list-item .sub{font-size:12px; color:var(--muted);}
  .chev{color:var(--muted);}
  .detail-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--muted);}
  .attend-ring{display:flex; align-items:center; gap:16px;}
  .ring{width:74px; height:74px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Poppins'; font-weight:700; font-size:17px; color:var(--navy); background:conic-gradient(var(--gold) calc(var(--pct)*1%), var(--line) 0);}
  .ring span{background:#fff; width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  textarea,input{width:100%; padding:10px 11px; border:1.5px solid var(--line); border-radius:9px; font-family:inherit; font-size:14.5px; margin-top:4px; margin-bottom:12px;}
  label{font-size:12.5px; font-weight:600; color:var(--muted);}
  .btn{padding:11px 16px; border:none; border-radius:9px; background:var(--navy); color:#fff; font-weight:600; cursor:pointer; font-size:14px; width:100%;}
  .badge{font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600;}
  .badge.pending{background:#FFF4E0; color:#B7791F;}
  .badge.approved{background:#EAF5EF; color:var(--ok);}
  .badge.rejected{background:#FDECEA; color:var(--danger);}
  nav.tabbar{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; z-index:6;}
  nav.tabbar div{flex:1; text-align:center; padding:10px 0 8px; font-size:11.5px; color:var(--muted); cursor:pointer; font-weight:600;}
  nav.tabbar div.active{color:var(--navy);}
  nav.tabbar div .ic{font-size:19px; display:block; margin-bottom:2px;}
</style>
</head>
<body>
<header>
  <h1 id="headerName">VidyaConnect</h1>
  <span class="role">STUDENT</span>
</header>

<!-- ============ HOME (read-only feed) ============ -->
<div class="page" id="pane-home">
  <div id="feedList"><p style="color:var(--muted); font-size:13.5px;">Loading feed…</p></div>
</div>

<!-- ============ TEACHERS (view-only) ============ -->
<div class="page hidden" id="pane-teachers">
  <div class="card" id="teacherListCard"><p style="color:var(--muted); font-size:13.5px;">Loading…</p></div>
</div>

<!-- ============ PROFILE ============ -->
<div class="page hidden" id="pane-profile">
  <div class="card" id="myProfileCard"></div>

  <div class="card">
    <h3 style="margin-top:0; font-family:'Poppins'; font-size:15px;">Attendance</h3>
    <div class="attend-ring">
      <div class="ring" id="attendRing" style="--pct:0"><span id="attendPct">0%</span></div>
      <div style="font-size:13px; color:var(--muted);" id="attendSummary">No records yet.</div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; font-family:'Poppins'; font-size:15px;">Apply for leave</h3>
    <label>Reason</label>
    <textarea id="leaveReason" placeholder="Reason for leave" rows="3"></textarea>
    <label>From date</label>
    <input type="date" id="leaveFrom">
    <label>To date</label>
    <input type="date" id="leaveTo">
    <button class="btn" onclick="submitLeave()">Submit application</button>
    <div id="leaveMsg" style="font-size:13px; margin-top:10px;"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0; font-family:'Poppins'; font-size:15px;">My leave applications</h3>
    <div id="myLeaveList"><p style="color:var(--muted); font-size:13px;">No applications yet.</p></div>
  </div>
</div>

<!-- ============ TEACHER DETAIL ============ -->
<div class="page hidden" id="pane-personDetail">
  <div class="card" style="margin-bottom:10px;"><span style="color:var(--navy); font-weight:600; cursor:pointer;" onclick="switchTab('teachers')">← Back to Teachers</span></div>
  <div class="card" id="personDetailCard"></div>
</div>

<nav class="tabbar">
  <div class="active" onclick="switchTab('home')"><span class="ic">🏠</span>Home</div>
  <div onclick="switchTab('teachers')"><span class="ic">🧑‍🏫</span>Teachers</div>
  <div onclick="switchTab('profile')"><span class="ic">👤</span>Profile</div>
</nav>

<script>
const SUPABASE_URL = "https://dqrrmxawowoxrqukronq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_C2r3bKoE9QDu9GeJHFa1Hw_Ztv5OuHX";
let sb = null;
try{
  if(!SUPABASE_URL || SUPABASE_URL.includes('YOUR_SUPABASE') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')){
    throw new Error('Supabase URL/Key not set yet');
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(e){
  console.error('Supabase init failed:', e);
  document.body.innerHTML = '<div style="padding:30px;font-family:sans-serif;color:#C0392B;">App is not connected to the database yet. Add the Supabase URL and anon key at the top of the script in this file.</div>';
}

let me = null;

async function boot(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ window.location.href = 'index.html'; return; }
  const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if(!profile || profile.role !== 'student'){ window.location.href = 'index.html'; return; }
  me = profile;
  document.getElementById('headerName').textContent = `Hi, ${me.full_name.split(' ')[0]}`;
  loadFeed();
  loadMyProfileCard();
  loadAttendance();
  loadMyLeaves();
}
boot();

function switchTab(tab){
  ['home','teachers','profile'].forEach(t=>{
    document.getElementById('pane-'+t).classList.toggle('hidden', t!==tab);
  });
  document.getElementById('pane-personDetail').classList.add('hidden');
  document.querySelectorAll('nav.tabbar div').forEach((el,i)=>{
    el.classList.toggle('active', ['home','teachers','profile'][i]===tab);
  });
  if(tab==='teachers') loadTeachersList();
}

function escapeHtml(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- FEED (read-only) ----------
async function loadFeed(){
  const { data: posts } = await sb.from('posts')
    .select('*, profiles!posts_author_id_fkey(full_name, role)')
    .eq('institute_id', me.institute_id).order('created_at', { ascending:false }).limit(50);
  const el = document.getElementById('feedList');
  if(!posts || posts.length===0){ el.innerHTML = '<p style="color:var(--muted); font-size:13.5px;">No updates yet.</p>'; return; }
  el.innerHTML = posts.map(p=>`
    <div class="card post">
      <div class="who">${p.profiles?.full_name || 'Unknown'}</div>
      <div class="when">${new Date(p.created_at).toLocaleString()}</div>
      <div class="body">${escapeHtml(p.content)}</div>
    </div>`).join('');
}

// ---------- TEACHERS (view only) ----------
async function loadTeachersList(){
  const { data } = await sb.from('profiles').select('*').eq('institute_id', me.institute_id).eq('role','teacher');
  document.getElementById('teacherListCard').innerHTML = (data||[]).map(t=>`
    <div class="list-item" onclick='openTeacherDetail(${JSON.stringify(t).replace(/'/g,"&#39;")})'>
      <div><div class="name">${t.full_name}</div><div class="sub">${t.subject||'—'}</div></div>
      <div class="chev">›</div>
    </div>`).join('') || '<p style="color:var(--muted); font-size:13.5px;">No teachers yet.</p>';
}

function openTeacherDetail(t){
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  document.getElementById('pane-personDetail').classList.remove('hidden');
  document.getElementById('personDetailCard').innerHTML = `
    <h2 style="font-family:'Poppins'; font-size:18px; margin:0 0 12px;">${t.full_name}</h2>
    <div class="detail-row"><span class="k">Age</span><span>${t.age||'-'}</span></div>
    <div class="detail-row"><span class="k">Subject</span><span>${t.subject||'-'}</span></div>
    <div class="detail-row"><span class="k">Experience</span><span>${(t.experience_years||0)+' yrs'}</span></div>
    <div class="detail-row"><span class="k">Mobile</span><span>${t.mobile}</span></div>
    <div class="detail-row"><span class="k">Email</span><span>${t.email}</span></div>`;
}

// ---------- PROFILE ----------
function loadMyProfileCard(){
  const rows = [];
  rows.push(['Age', me.age||'-']);
  rows.push(['Roll number', me.roll_number||'-']);
  if(me.class){ rows.push(['Class', me.class]); rows.push(['Section', me.section||'-']); if(me.stream) rows.push(['Stream', me.stream]); if(me.board) rows.push(['Board', me.board]); }
  else { rows.push(['Course', me.course||'-']); if(me.branch) rows.push(['Branch', me.branch]); rows.push(['Semester', me.semester||'-']); }
  rows.push(['Mobile', me.mobile]);
  rows.push(['Email', me.email]);
  document.getElementById('myProfileCard').innerHTML = `
    <h2 style="font-family:'Poppins'; font-size:18px; margin:0 0 12px;">${me.full_name}</h2>
    ${rows.map(([k,v])=>`<div class="detail-row"><span class="k">${k}</span><span>${v}</span></div>`).join('')}`;
}

async function loadAttendance(){
  const { data } = await sb.from('attendance').select('status').eq('student_id', me.id);
  const total = (data||[]).length;
  const present = (data||[]).filter(r=>r.status==='present').length;
  const pct = total ? Math.round((present/total)*100) : 0;
  document.getElementById('attendRing').style.setProperty('--pct', pct);
  document.getElementById('attendPct').textContent = pct+'%';
  document.getElementById('attendSummary').textContent = total ? `${present} present out of ${total} marked days.` : 'No records yet.';
}

async function submitLeave(){
  const reason = document.getElementById('leaveReason').value.trim();
  const from = document.getElementById('leaveFrom').value;
  const to = document.getElementById('leaveTo').value;
  const msg = document.getElementById('leaveMsg');
  if(!reason || !from || !to){ msg.textContent = 'Fill in reason, from and to dates.'; msg.style.color = 'var(--danger)'; return; }

  const { error } = await sb.from('leave_requests').insert({
    institute_id: me.institute_id, requester_id: me.id, reason, date_from: from, date_to: to
  });
  if(error){ msg.textContent = error.message; msg.style.color = 'var(--danger)'; return; }
  msg.textContent = 'Application submitted.'; msg.style.color = 'var(--ok)';
  document.getElementById('leaveReason').value=''; document.getElementById('leaveFrom').value=''; document.getElementById('leaveTo').value='';
  loadMyLeaves();
}

async function loadMyLeaves(){
  const { data } = await sb.from('leave_requests').select('*').eq('requester_id', me.id).order('created_at', { ascending:false });
  const el = document.getElementById('myLeaveList');
  if(!data || data.length===0){ el.innerHTML = '<p style="color:var(--muted); font-size:13px;">No applications yet.</p>'; return; }
  el.innerHTML = data.map(r=>`
    <div class="detail-row" style="flex-direction:column; align-items:flex-start; gap:4px;">
      <div style="display:flex; justify-content:space-between; width:100%;">
        <span>${r.date_from} → ${r.date_to}</span>
        <span class="badge ${r.status}">${r.status}</span>
      </div>
      <div style="font-size:13px; color:var(--muted);">${escapeHtml(r.reason)}</div>
    </div>`).join('');
}
</script>
</body>
</html>
